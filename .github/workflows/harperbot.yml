---
name: HarperBot

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  issue_comment:
    types: [created]
  check_run:
    types: [rerequested, requested_action]
  push:
    branches: [main]

# Package versions
env:
  GENERATIVE_AI_VERSION: 2.30.0

# Required permissions
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install Gemini CLI
        run: |
          # Install Node.js dependencies with pinned versions from environment
          npm install -g @google/genai@${GENERATIVE_AI_VERSION}

          # Create Gemini CLI wrapper with proper module resolution and version fallback
          cat > /usr/local/bin/gemini-wrapper << 'EOL'
          #!/bin/sh
          NODE_PATH=$(npm root -g) node -e "
          const fs = require('fs');
          const path = require('path');
          const modulePath = require.resolve('@google/generative-ai');
          const pkgPath = path.join(path.dirname(modulePath), 'package.json');
          import(modulePath).then(m => {
            const fallback = fs.existsSync(pkgPath) ?
              JSON.parse(fs.readFileSync(pkgPath, 'utf8')).version : 'unknown';
            console.log(m.GOOGLE_GENERATIVE_AI_VERSION || fallback);
          }).catch(e => {
            console.error('Error loading @google/generative-ai:', e);
            process.exit(1);
          });"
          EOL

          # Make the script executable
          chmod +x /usr/local/bin/gemini-wrapper

      - name: Verify installation
        run: |
          # Test the installation
          echo "Google GenAI CLI installed"
          # gemini --version  # Command may vary with new package

  bot:
    name: Bot
    if: |
      (
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/analyze') &&
        contains(
          fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association
        )
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.name == 'HarperBot review' &&
        (
          github.event.action == 'rerequested' ||
          github.event.requested_action.identifier == 'rerun-analysis'
        ) &&
        length(github.event.check_run.check_suite.pull_requests) > 0
      )
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 10

    steps:
      - name: Install system dependencies
        run: |
          # Install git (required for actions/checkout in container)
          # Note: Node.js removed as the Python bot doesn't require it
          apt-get update && apt-get install -y --no-install-recommends git

      - name: Configure Git
        run: |
          git config --global --add safe.directory /__w/harperbot/harperbot
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

    # Checkout PR code for analysis
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha }}
          fetch-depth: 1

      # Install Python dependencies required for HarperBot
      - name: Install dependencies
        run: |
          # Install Python dependencies
          python -m pip install --upgrade --no-cache-dir \
            PyGithub python-dotenv PyYAML google-genai==2.31.0 cerebras-cloud-sdk==1.91.0 requests

          # Verify installations
          python --version
          pip --version

    # Generate GitHub App token for PR commenting
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARPER_BOT_APP_ID || secrets.APP_ID }}
          private-key: ${{ secrets.HARPER_BOT_PRIVATE_KEY || secrets.PRIVATE_KEY }}

      # Run HarperBot to analyze PR with AI (Gemini or Cerebras)
      - name: Run AI PR Bot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Verify installations
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Python: $(python --version)"
          echo "pip: $(pip --version)"

          # Run the PR bot script with repository and PR number
          python ./src/harperbot/harperbot.py \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.check_suite.pull_requests[0].number }}

      - name: Post inline suggestions
        uses: actions/github-script@v7
        if: hashFiles('suggestions.json') != ''
        with:
          script: |
            const fs = require('fs')
            const suggestions = JSON.parse(fs.readFileSync('suggestions.json', 'utf8'))
            if (suggestions.length > 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                comments: suggestions
              })
              console.log(`Posted ${suggestions.length} inline suggestions`)
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
