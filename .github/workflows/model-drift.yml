name: Model drift check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --no-cache-dir \
            PyGithub python-dotenv PyYAML google-genai cerebras-cloud-sdk \
              requests
          python -m pip install --no-cache-dir .

      - name: Check configured models
        id: drift
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          harperbot drift-check > drift-report.txt
          code=$?
          cat drift-report.txt
          exit $code

      - name: Open issue on drift
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[model-drift] default model missing from live listing"
          open_issue=$(gh issue list --search "$title in:title state:open" \
            --json number --jq '.[0].number')
          if [ -z "$open_issue" ]; then
            gh issue create --title "$title" --body-file drift-report.txt
          else
            echo "Drift issue already open, not duplicating."
          fi
