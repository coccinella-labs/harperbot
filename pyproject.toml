[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harperbot"
version = "0.1.0"
description = "GitHub PR Bot with Gemini AI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask",
    "requests",
    "PyGithub",
    "python-dotenv",
    "google-genai",
    "cerebras-cloud-sdk",
    "PyYAML",
    "mkdocs",
    "mkdocs-include-markdown-plugin"
]

[project.scripts]
harperbot = "harperbot.harperbot:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harperbot*"]

[tool.setuptools.package-data]
harperbot = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The google-genai SDK reaches into a deprecated typing private on Python
# 3.14. Dependency noise, not ours; revisit on SDK or Python upgrade.
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# Explicit because ruff's implicit default set grows between releases.
# With no config here, bumping the hook silently changes what fails:
# 0.17's defaults flag 127 findings across LOG, BLE, SIM, RUF and ISC on
# code that 0.6 accepted. Several (BLE001, TRY004) would mean
# restructuring the bot's error handling, which is a behavior change, not
# a lint fix. Keep this list small and deliberate; widen it as its own
# reviewed change.
select = ["E4", "E7", "E9", "F"]
