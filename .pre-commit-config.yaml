---
repos:
  # Python Formatting
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        name: black
        description: "Black: The uncompromising Python code formatter"
        entry: black
        language: python
        types: [python]
        require_serial: true
        args: [--line-length=127, --safe, --quiet]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort (python)
        description: "Sorts Python imports"
        entry: isort --profile black --line-length=127
        language: python
        types: [python]
        require_serial: true

  # Python Linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # YAML Linting
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        types: [yaml]
        args: [--strict]
        additional_dependencies: [yamllint]

  # Spelling
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=*.pyc,*.pyo,__pycache__
        # .py files carry model-authored prompt text and API vocabulary
        # that are not English prose. tests/fixtures holds recorded API
        # responses: editing a typo there would falsify the recording.
        exclude: ^(.*\.py|tests/fixtures/.*)$

  # JSON
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: end-of-file-fixer
        exclude: \.min\.(js|css)$
      - id: trailing-whitespace
        args: []
